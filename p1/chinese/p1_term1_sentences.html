<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.1 Term 1 中文句子記憶遊戲</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #fffde7, #e0f7fa);
      margin: 0;
      padding: 10px;
    }
    h1 { color: #00796b; font-size: 1.5em; margin: 10px 0; }
    #progressContainer {
      width: 95%;
      margin: 10px auto;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
    }
    #progressBar {
      height: 16px;
      width: 0%;
      background: #4caf50;
      transition: width 0.3s;
    }
    #matrix {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 6px;
      justify-content: center;
      margin: 15px auto;
      max-width: 95vw;
    }
    .cell {
      border: 1px solid #999;
      font-size: 1.2em;
      padding: 8px;
      cursor: pointer;
      background: #fff;
      border-radius: 6px;
      user-select: none;
    }
    .cell.selected { background: #ffe082; }
    #selected { margin: 10px; font-size: 1.2em; min-height: 1.5em; }
    button {
      font-size: 1em;
      padding: 10px 18px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 40%;
      max-width: 200px;
    }
    #retryBtn {
      background: #f44336; /* red */
      color: #fff;
    }
    #submitBtn {
      background: #4caf50; /* green */
      color: #fff;
    }
    #message { font-size: 1.1em; margin-top: 10px; color: #d32f2f; }
    @media (min-width: 600px) {
      h1 { font-size: 2em; }
      .cell { font-size: 1.5em; padding: 12px; }
      button { width: auto; }
    }
  </style>
</head>
<body>
  <h1>P.1 Term 1 中文句子記憶遊戲</h1>
  <div id="progressContainer"><div id="progressBar"></div></div>
  <div id="sentenceNo"></div>
  <button onclick="startGame()">開始遊戲 ▶️</button>
  <div id="matrix"></div>
  <div id="selected"></div>
  <button id="retryBtn" onclick="retry()">🔄 重試</button>
  <button id="submitBtn" onclick="submit()">✅ 提交</button>
  <div id="message"></div>

<script>
const sentences = [
  "草兒點頭笑。",
  "月亮又圓又大。",
  "媽媽扮的小羊很可愛。",
  "自己的事自己做，大家都誇我真棒！"
];
const fillerChars = ["人","大","小","天","地","山","水","火","手","口",
                     "日","月","木","禾","鳥","魚","馬","牛","羊","花",
                     "草","心","耳","目","足","石"];

let currentSentenceIndex = 0;
let selectedChars = [];

function startGame() {
  selectedChars = [];
  document.getElementById("selected").textContent = "";
  document.getElementById("message").textContent = "";
  document.getElementById("sentenceNo").textContent = 
    "句子 " + (currentSentenceIndex+1) + " / " + sentences.length;
  fillMatrix(sentences[currentSentenceIndex]);
}

function fillMatrix(sentence) {
  const chars = sentence.split("");
  let matrixChars = [...chars];
  while (matrixChars.length < 25) {
    matrixChars.push(fillerChars[Math.floor(Math.random()*fillerChars.length)]);
  }
  matrixChars.sort(() => Math.random() - 0.5);
  const matrixDiv = document.getElementById("matrix");
  matrixDiv.innerHTML = "";
  matrixChars.forEach(ch => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.textContent = ch;
    cell.onclick = () => selectChar(cell, ch);
    matrixDiv.appendChild(cell);
  });
}

function selectChar(cell, ch) {
  if (!cell.classList.contains("selected")) {
    cell.classList.add("selected");
    selectedChars.push(ch);
    document.getElementById("selected").textContent = selectedChars.join("");
  }
}

function retry() {
  selectedChars = [];
  document.getElementById("selected").textContent = "";
  document.querySelectorAll(".cell").forEach(c => c.classList.remove("selected"));
  document.getElementById("message").textContent = "";
}

function submit() {
  const sentence = sentences[currentSentenceIndex];
  if (selectedChars.join("") === sentence) {
    document.getElementById("message").textContent = "✅ 正確！";
    currentSentenceIndex++;
    updateProgress();
    if (currentSentenceIndex < sentences.length) {
      setTimeout(startGame, 1000);
    } else {
      document.getElementById("message").textContent = "🎉 全部完成！";
    }
  } else {
    document.getElementById("message").textContent = "❌ 錯誤，請重試或放棄。";
  }
}

function updateProgress() {
  const progress = ((currentSentenceIndex) / sentences.length) * 100;
  document.getElementById("progressBar").style.width = progress + "%";
}
</script>
</body>
</html>
